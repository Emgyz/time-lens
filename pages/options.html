<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>TimeLens Settings</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <main class="settings">
        <h1>TimeLens Settings</h1>
        <p class="muted">Domains include all subdomains.</p>
        <div id="sites"></div><button id="add">Add website</button>

        <hr><label>Focus message <input id="focusMessage"></label>
        <label><input type="checkbox" id="notifications">Notifications</label>
        <button id="save">Save settings</button>

        <section>
            <h2>Data</h2>

            <div class="data-buttons">
                <button id="exportCsv">
                    Export CSV
                </button>

                <button id="importCsv">
                    Import CSV
                </button>

                <button id="reset">
                    Reset Usage Data
                </button>

                <input id="importFile" type="file" accept=".csv,text/csv" hidden>
            </div>

            <div id="status" class="muted"></div>
        </section>

        <p id="status" class="muted"></p>
    </main>
    <script src="../code/options.js"></script>
</body>

</html>
